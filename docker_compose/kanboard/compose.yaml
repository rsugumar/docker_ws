name: kanboard

services:
  app:
    image: ${KANBOARD_IMAGE:-kanboard/kanboard:latest}
    container_name: kanboard
    restart: always
    ports:
     - "127.0.0.1:8080:80"
    volumes:
     - data:/var/www/app/data
     - plugins:/var/www/app/plugins
     - certs:/etc/nginx/ssl
    environment:
     - PLUGIN_INSTALLER=true # Swap to true to enable web based plugin installation
    networks:
      - adguard_default

volumes:
  data:
  plugins:
  certs:

networks:
  adguard_default:
    external: true
    name: adguard_network