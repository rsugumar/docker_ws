services:
  plex:
    container_name: plex
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    environment:
      - PLEX_CLAIM=${PLEX_CLAIM}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - plex-server-data:/config
      - /mnt/disk1/Videos:/media/Disk1
      - /mnt/disk2/Videos:/media/Disk2
      - /mnt/disk3/Videos:/media/Disk3
      - /mnt/disk4/Videos:/media/Disk4
      - /mnt/disk5/Videos:/media/Disk5
      - /mnt/disk6/Videos:/media/Disk6
      - /mnt/disk7/Videos:/media/Disk7

volumes:
  plex-server-data:
